# ============================================================
# .github/dependabot.yml
#
# - github-actions: keeps workflow action versions current.
# - npm: keeps frontend/package.json dependencies current.
# - docker: keeps the ubuntu base image in Dockerfile and
#   Dockerfile.demo current.
#
# No entry for the backend C++ deps: those are git submodules under
# backend/external/ (see .gitmodules). Bump those manually.
# ============================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
