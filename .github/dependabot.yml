# ============================================================
# .github/dependabot.yml
#
# - github-actions: keeps workflow action versions current.
# - npm: keeps frontend/package.json dependencies current.
# - docker: keeps the ubuntu base image in Dockerfile and
#   Dockerfile.demo current.
#
# No entry for the backend C++ deps: those are git submodules under
# backend/external/ (see .gitmodules). Bump those manually.
# ============================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # One PR for every update in this ecosystem. Without a group, Dependabot opens a PR per
    # dependency, and sub-actions of one repo (e.g. clusterfuzzlite build_fuzzers and
    # run_fuzzers) count as separate dependencies, so each PR bumps only its own lines and
    # leaves the others on the old version. A group moves them all together.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  # OSS-Fuzz base image used by ClusterFuzzLite. Keeps the pinned
  # sha256 digest in .clusterfuzzlite/Dockerfile up to date.
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    groups:
      docker:
        patterns:
          - "*"
