# ============================================================
# .github/dependabot.yml
#
# - github-actions: keeps workflow action versions current.
# - npm: keeps frontend/package.json dependencies current.
# - docker: keeps the ubuntu base image in Dockerfile and
#   Dockerfile.demo current.
#
# No entry for the backend C++ deps: those are git submodules under
# backend/external/ (see .gitmodules). Bump those manually.
# ============================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Sub-actions of one repo are separate dependencies to Dependabot, so each pair gets a group
    # that moves it together in ONE PR, for every kind of update (major included). Otherwise one
    # PR bumps build_fuzzers and leaves run_fuzzers on the old version, or the reverse.
    # Everything else is grouped for minor and patch bumps only: a major bump gets its own PR, so
    # it can fail or be postponed without holding back the rest. (A dependency joins the first
    # group that matches it, which is why the specific groups come first.)
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      clusterfuzzlite:
        patterns:
          - "google/clusterfuzzlite/*"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
    # Minor and patch bumps share one PR. A major bump gets its own PR, so a breaking release
    # (for example a new TypeScript major) can't sink the whole group.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # typescript-eslint caps its TypeScript peer at "<6.1.0" (checked on its latest release,
      # 8.72.1), so a newer TypeScript makes `npm ci` fail with ERESOLVE. Stay on 6.0.x until
      # typescript-eslint widens its range, then delete this block.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  # OSS-Fuzz base image used by ClusterFuzzLite. Keeps the pinned
  # sha256 digest in .clusterfuzzlite/Dockerfile up to date.
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    groups:
      docker:
        patterns:
          - "*"
