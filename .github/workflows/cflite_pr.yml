# ============================================================
# .github/workflows/cflite_pr.yml
# Short ClusterFuzzLite pass on every pull request that touches the
# code the fuzz harnesses exercise (or the harnesses themselves), so
# a memory-safety bug or decoder crash fails CI before merge.
# ============================================================

name: PR Fuzzing

on:
  pull_request:
    paths:
      - "backend/src/**"
      - "backend/fuzz/**"
      - "backend/external/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  PR:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        sanitizer:
          - address
          - undefined
    steps:
      # The backend builds against git submodules, so they must be present
      # in the workspace before the fuzzers are built.
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build Fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: c++
          github-token: ${{ secrets.GITHUB_TOKEN }}
          sanitizer: ${{ matrix.sanitizer }}

      - name: Run Fuzzers (${{ matrix.sanitizer }})
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 180
          mode: "code-change"
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
