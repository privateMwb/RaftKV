# ============================================================
# .github/workflows/frontend.yml
# Lints and builds the frontend/ Vite + React app.
# ============================================================

name: Frontend

on:
  push:
    paths:
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No submodules needed — frontend/ never touches backend/external/.

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22" # the tests run TypeScript directly (needs Node 22.18+)
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
