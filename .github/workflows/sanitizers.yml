# ============================================================
# .github/workflows/sanitizers.yml
# Builds the backend with AddressSanitizer + UndefinedBehaviorSanitizer,
# and separately with ThreadSanitizer, then runs the whole test suite
# (unit and integration, including real multi-node clusters) plus a
# smoke test of a real node under each one.
#
# The smoke test (scripts/ci-smoke.sh) boots raftkv_backend, writes and
# reads keys, fires a burst of concurrent writes, opens the event
# stream, and shuts the node down with SIGTERM. ThreadSanitizer only
# reports what actually gets exercised, which is why the tests and the
# concurrent burst matter more than merely booting the binary.
#
# ASan+UBSan can share one binary; ThreadSanitizer cannot be
# combined with ASan in the same build, hence two separate
# configure/build passes below.
#
# A sanitizer report fails the job: every sanitizer ends a report with a
# "SUMMARY: ...Sanitizer" line, which the steps below look for in
# addition to the process exit code.
# ============================================================

name: Sanitizers

on:
  push:
  pull_request:

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fail fast and visibly rather than hang silently.
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang curl

      - name: Configure
        working-directory: backend
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=address,undefined -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=address,undefined
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: backend
        run: cmake --build build

      - name: Lower ASLR entropy (sanitizers can abort at startup without this)
        run: sudo sysctl -q vm.mmap_rnd_bits=28 || true

      - name: Run the test suite under ASan + UBSan
        working-directory: backend
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          set -o pipefail
          ./build/raftkv_tests 2>&1 | tee tests.log
          if grep -qE "SUMMARY: [A-Za-z]*Sanitizer|runtime error:" tests.log; then
            echo "A sanitizer reported an error -- see log above."
            exit 1
          fi

      - name: Smoke test a real node under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: scripts/ci-smoke.sh backend/build/raftkv_backend

  tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Fail fast and visibly instead of silently
                        # consuming CI hours if the app hangs (real
                        # deadlock, or an unready process + a
                        # timeout-less wait).
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang curl

      - name: Configure
        working-directory: backend
        env:
          CXX: clang++
          CXXFLAGS: -fsanitize=thread -fno-omit-frame-pointer -g -O1
          LDFLAGS: -fsanitize=thread
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        working-directory: backend
        run: cmake --build build

      - name: Lower ASLR entropy (sanitizers can abort at startup without this)
        run: sudo sysctl -q vm.mmap_rnd_bits=28 || true

      - name: Run the test suite under TSan
        working-directory: backend
        env:
          TSAN_OPTIONS: halt_on_error=0
        run: |
          set -o pipefail
          ./build/raftkv_tests 2>&1 | tee tests.log
          if grep -qE "WARNING: ThreadSanitizer|SUMMARY: ThreadSanitizer" tests.log; then
            echo "ThreadSanitizer reported a data race -- see log above."
            exit 1
          fi

      - name: Smoke test a real node under TSan
        env:
          TSAN_OPTIONS: halt_on_error=0
        run: scripts/ci-smoke.sh backend/build/raftkv_backend
