<svg width="1200" height="28" viewBox="0 0 1200 28" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="r" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0"   y="13" width="548" height="2" rx="1" fill="url(#l)"/>
  <rect x="652" y="13" width="548" height="2" rx="1" fill="url(#r)"/>
  <!-- three-node mark: leader in the middle -->
  <path d="M574 14 L600 14 M600 14 L626 14" stroke="#1E3A5F" stroke-width="2"/>
  <circle cx="574" cy="14" r="5" fill="#0B1220" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="626" cy="14" r="5" fill="#0B1220" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="600" cy="14" r="7" fill="#2DD4BF" filter="url(#g)">
    <animate attributeName="r" values="7;8.5;7" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
